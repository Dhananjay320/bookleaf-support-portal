# Render Blueprint: the API only. The React app is deployed on Vercel (see client/vercel.json),
# which proxies /api/* here so the browser sees a single origin.
services:
  - type: web
    name: bookleaf-support-api
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false   # set in the Render dashboard; never committed
